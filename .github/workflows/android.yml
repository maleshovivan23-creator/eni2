name: build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v1
      - name: deps
        run: |
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libffi-dev libssl-dev libbz2-dev libsqlite3-dev autoconf automake libtool pkg-config cmake ninja-build
      - name: build
        run: |
          yes | buildozer android debug > build.log 2>&1 || { tail -n 2000 build.log | grep -v '^#' | tail -n 300; exit 1; }
      - name: log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
